# Optional local container build. Production deployment uses Hugo + SCP.
#
#   docker compose up -d --build
#   open http://localhost:8080

name: themindcamp-gaiden-console

services:
  web:
    build:
      context: .
    image: themindcamp-gaiden:dev
    restart: unless-stopped
    ports:
      - "127.0.0.1:${MCG_PORT:-8080}:80"
    read_only: true
    tmpfs:
      - /run
      - /tmp
      - /var/cache/nginx
    cap_drop:
      - ALL
    cap_add:
      - CHOWN
      - SETGID
      - SETUID
    security_opt:
      - no-new-privileges:true
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://127.0.0.1/"]
      interval: 30s
      timeout: 3s
      start_period: 5s
      retries: 3
