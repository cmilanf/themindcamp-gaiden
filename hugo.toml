baseURL = 'https://themindcamp.net/'
locale = 'es-ES'
defaultContentLanguage = 'es'
title = 'The MindCamp Gaiden'
enableRobotsTXT = true
disableKinds = ['taxonomy', 'term', 'rss', 'sitemap']

# Las páginas de contenido no se publican como HTML: son "ficheros" que consume
# la consola. Se siguen listando para poder construir el payload JSON.
[[cascade]]
  [cascade.build]
    render = 'never'
    list = 'always'
  [cascade.target]
    path = '{/sections/**,/ponentes/**,/agenda/**}'

# Sin fechas en el front matter usamos la del fichero: así `ls -l` muestra
# la fecha real de la última edición del markdown.
[frontmatter]
  date = ['date', ':fileModTime']
  lastmod = ['lastmod', ':fileModTime']

[markup.goldmark.renderer]
  unsafe = true
[markup.goldmark.parser]
  wrapStandAloneImageWithinParagraph = false
[markup.goldmark.extensions.typographer]
  # En una consola queremos comillas y guiones literales, no tipográficos.
  disable = true
[markup.goldmark.parser.attribute]
  block = true
  title = true
[markup.tableOfContents]
  startLevel = 2
  endLevel = 3
[markup.highlight]
  # Sin estilos en línea: el bloque de código hereda la paleta de la consola.
  noClasses = false
  guessSyntax = false

[params]
  # ---- Identidad del evento -------------------------------------------------
  edition = 'Gaiden'
  editionName = 'gaiden'
  editionKanji = '外伝'
  tagline = 'La desconferencia tecnológica autogestionada'
  description = 'The MindCamp Gaiden - Desconferencia tecnológica - Sigüenza, Guadalajara - 27-29 de noviembre de 2026'

  # ---- Fechas y lugar -------------------------------------------------------
  startDate = '2026-11-27T20:00:00+01:00'
  endDate = '2026-11-29T17:00:00+01:00'
  datesHuman = '27-29 de noviembre de 2026'
  venue = 'Hospedería Porta Coeli'
  city = 'Sigüenza (Guadalajara)'
  venueURL = 'https://portacoeli.es/'
  address = 'Calle Mayor 50, 19250 Sigüenza (Guadalajara)'
  venuePhone = '949 391 875'
  mapURL = 'https://www.google.com/maps/search/?api=1&query=Hospeder%C3%ADa+Porta+Coeli%2C+Calle+Mayor+50%2C+19250+Sig%C3%BCenza'
  price = 'TBD'

  # ---- Enlaces --------------------------------------------------------------
  twitter = 'TBD'
  youtube = 'https://www.youtube.com/playlist?list=PLnJ8jujJSEaGAqshIUMEqr2wNWTam8BTF'
  mail = 'TBD'

  # ---- Cosmética de la consola ---------------------------------------------
  hostname = 'mindcamp'
  user = 'visitante'
  version = '1.0'          # versión del sitio: se muestra como kernel y shell
  arch = 'x86_64-barcamp'
  distro = 'MindCampOS Gaiden'
  defaultTheme = 'tty'
  defaultTTY = 'web'       # 'web' respeta el scroll del documento, 'term' persigue el final

  # Días de la agenda (agrupación de las sesiones por `day` en el front matter)
  [[params.days]]
    n = 1
    label = 'Viernes 27 de noviembre (noche)'
    short = 'VIE'
  [[params.days]]
    n = 2
    label = 'Sábado 28 de noviembre'
    short = 'SÁB'
  [[params.days]]
    n = 3
    label = 'Domingo 29 de noviembre'
    short = 'DOM'

[outputs]
  home = ['html']
