# Sample Nginx server block for the optional Docker image.
#
# This site is fully static (one HTML page, hashed/fingerprinted CSS and JS,
# no forms, no third-party embeds, no fetch/XHR calls), so the headers below
# can be strict. See README.md ("Cabeceras de seguridad") for the reasoning
# behind each one.
#
# NOTE: this file only affects the optional Docker image built from this
# repo. It has no effect on the production deployment, which uploads static
# files over SCP to an external host — replicate these headers in that
# host's own web server / reverse proxy configuration.

server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    server_tokens off;

    # Content-Security-Policy: 'self' covers everything the site actually
    # loads. style-src-attr allows the inline style="color:...;background:..."
    # attributes that assets/js/ansi.js writes for 256-color/RGB ANSI escape
    # sequences that fall outside the 16-color CSS classes.
    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self'; style-src-attr 'unsafe-inline'; img-src 'self'; font-src 'self'; connect-src 'self'; object-src 'none'; base-uri 'none'; form-action 'none'; frame-ancestors 'none'; frame-src 'none'; worker-src 'none'; manifest-src 'none'; upgrade-insecure-requests" always;

    # HSTS: harmless to send over plain HTTP (browsers ignore it on
    # non-HTTPS responses), and takes effect if this image is later put
    # behind TLS. "preload" is intentionally omitted — that's a much harder
    # to reverse, domain-wide commitment best decided separately.
    add_header Strict-Transport-Security "max-age=63072000; includeSubDomains" always;

    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=(), usb=(), interest-cohort=()" always;
    add_header Cross-Origin-Opener-Policy "same-origin" always;
    add_header Cross-Origin-Resource-Policy "same-origin" always;

    location / {
        try_files $uri $uri/ =404;
    }

    location = /health {
        access_log off;
        default_type text/plain;
        return 200 "ok\n";
    }
}
